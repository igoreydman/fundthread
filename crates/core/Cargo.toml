[package]
name = "fundthread-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"

[features]
legacy-sqlcipher = ["dep:rusqlite"]

[[bin]]
name = "import-sqlcipher"
path = "src/bin/import-sqlcipher.rs"
required-features = ["legacy-sqlcipher"]
